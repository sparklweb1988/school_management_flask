{% extends "base.html" %}

{% block title %}
Add Session
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h3 class="fw-bold mb-4">
                    Add School Session
                </h3>

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            Session
                        </label>

                        <input
                            type="text"
                            name="year"
                            class="form-control"
                            placeholder="e.g. 2026/2027"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Session
                    </button>

                    <a
                        href="{{ url_for('session.list_sessions') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
