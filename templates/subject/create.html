{% extends "base.html" %}

{% block title %}Add Subject{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h3 class="mb-4">
            Add Subject
        </h3>


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Subject Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="e.g. Mathematics"
                    required
                >

            </div>


            <button class="btn btn-primary">
                Save Subject
            </button>

            <a
                href="{{ url_for('subject.list_subjects') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
