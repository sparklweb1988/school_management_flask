{% extends "base.html" %}

{% block title %}Enter Result{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h3 class="mb-4">
            Enter Student Result
        </h3>


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Student
                </label>

                <select
                    name="student_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Student
                    </option>

                    {% for student in students %}

                    <option value="{{ student.id }}">
                        {{ student.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Subject
                </label>

                <select
                    name="subject_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Subject
                    </option>

                    {% for subject in subjects %}

                    <option value="{{ subject.id }}">
                        {{ subject.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Class
                </label>

                <select
                    name="classroom_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Class
                    </option>

                    {% for classroom in classrooms %}

                    <option value="{{ classroom.id }}">
                        {{ classroom.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Session
                    </label>

                    <select
                        name="session_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Session
                        </option>

                        {% for session in sessions %}

                        <option value="{{ session.id }}">
                            {{ session.year }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Term
                    </label>

                    <select
                        name="term_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Term
                        </option>

                        {% for term in terms %}

                        <option value="{{ term.id }}">
                            {{ term.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        CA Score
                    </label>

                    <input
                        type="number"
                        name="ca_score"
                        class="form-control"
                        min="0"
                        max="40"
                        step="0.01"
                        required
                    >

                    <small class="text-muted">
                        Maximum: 40
                    </small>

                </div>


                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Exam Score
                    </label>

                    <input
                        type="number"
                        name="exam_score"
                        class="form-control"
                        min="0"
                        max="60"
                        step="0.01"
                        required
                    >

                    <small class="text-muted">
                        Maximum: 60
                    </small>

                </div>

            </div>


            <button class="btn btn-primary">
                Save Result
            </button>

            <a
                href="{{ url_for('result.list_results') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
