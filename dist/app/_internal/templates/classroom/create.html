{% extends "base.html" %}

{% block title %}Add Class{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h3 class="mb-4">
            Add Class
        </h3>


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Class Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="e.g. JSS 1"
                    required
                >

            </div>


            <button class="btn btn-primary">
                Save Class
            </button>

            <a
                href="{{ url_for('classroom.list_classrooms') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
