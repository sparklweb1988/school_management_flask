{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h3 class="mb-4">
            Add Student
        </h3>


        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Parent Name
                    </label>

                    <input
                        type="text"
                        name="parent_name"
                        class="form-control"
                    >

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                    >

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                    >

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Class
                    </label>

                    <select
                        name="classroom_id"
                        class="form-select"
                    >

                        <option value="">
                            No Class
                        </option>

                        {% for classroom in classrooms %}

                        <option value="{{ classroom.id }}">
                            {{ classroom.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>

            </div>


            <button class="btn btn-primary">
                Create Student
            </button>

            <a
                href="{{ url_for('student.list_students') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
